name: Boilerplate CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run tests
      - name: Run tests
        run: npm run test

      # Step 5: Build Docker image
      - name: Build Docker image
        run: docker build -t boilerplate .

      # Step 6: Deploy (for local testing, this will run the container locally)
      - name: Deploy to local
        run: |
          docker run -d -p 3000:3000 boilerplate
